[project]
name = "ai-automation-doctor"
version = "1.2.0"
description = "Durable n8n automation reliability service with evaluated deterministic diagnosis, bounded AI advisory analysis, real-model diagnosis benchmarks, constrained human-approved remediation, idempotency, and crash-safe recovery."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app"]
