name: Publish container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "app/**"
      - "pyproject.toml"
      - ".github/workflows/publish-container.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "app/**"
      - "pyproject.toml"
      - ".github/workflows/publish-container.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1.3.0
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=AI Automation Doctor read-only demo and reliability service

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record successful container publish
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/deployment
          cat > docs/deployment/container-image.md <<EOF
          # Container publish receipt

          Image: \`ghcr.io/${GITHUB_REPOSITORY}:v1.3.0\`

          Latest alias: \`ghcr.io/${GITHUB_REPOSITORY}:latest\`

          Source commit: \`${GITHUB_SHA}\`

          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deployment/container-image.md
          if git diff --cached --quiet; then
            echo "Container receipt is unchanged."
            exit 0
          fi
          git commit -m "Record published v1.3.0 container image"
          git push
