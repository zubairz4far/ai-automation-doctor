name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: AI advisory and benchmark safety
        run: |
          pytest -q \
            tests/test_ai_diagnoser.py \
            tests/test_ai_evaluation.py
      - name: Durability recovery and security
        run: |
          pytest -q \
            tests/test_state_store.py \
            tests/test_idempotency.py \
            tests/test_security.py \
            tests/test_retry_recovery_lookup.py
      - name: Taxonomy benchmark V1
        run: python -m scripts.evaluate_taxonomy
      - name: Taxonomy benchmark V2 hard suite
        run: |
          python -m scripts.evaluate_taxonomy \
            --dataset evals/failure_taxonomy_v2.jsonl \
            --output evals/results/taxonomy_v2.json \
            --min-classification-accuracy 1.0 \
            --min-retry-safety-accuracy 1.0
      - name: Patch safety benchmark V1
        run: |
          python -m scripts.evaluate_patch_safety \
            --min-decision-accuracy 1.0 \
            --max-false-accept-rate 0.0
      - name: Remediation safety benchmark V1
        run: |
          python -m scripts.evaluate_remediation_safety \
            --min-decision-accuracy 1.0 \
            --max-unsafe-write-rate 0.0 \
            --max-unsafe-retry-rate 0.0
      - name: Build Docker image
        run: docker build -t ai-automation-doctor:ci .
