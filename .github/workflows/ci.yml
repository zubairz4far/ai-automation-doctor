name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: AI advisory and benchmark safety
        run: |
          pytest -q \
            tests/test_ai_diagnoser.py \
            tests/test_ai_evaluation.py
      - name: Durability recovery and security
        run: |
          pytest -q \
            tests/test_state_store.py \
            tests/test_idempotency.py \
            tests/test_security.py \
            tests/test_retry_recovery_lookup.py
      - name: Taxonomy benchmark V1
        run: python -m scripts.evaluate_taxonomy
      - name: Taxonomy benchmark V2 hard suite
        run: |
          python -m scripts.evaluate_taxonomy \
            --dataset evals/failure_taxonomy_v2.jsonl \
            --output evals/results/taxonomy_v2.json \
            --min-classification-accuracy 1.0 \
            --min-retry-safety-accuracy 1.0
      - name: Patch safety benchmark V1
        run: |
          python -m scripts.evaluate_patch_safety \
            --min-decision-accuracy 1.0 \
            --max-false-accept-rate 0.0
      - name: Remediation safety benchmark V1
        run: |
          python -m scripts.evaluate_remediation_safety \
            --min-decision-accuracy 1.0 \
            --max-unsafe-write-rate 0.0 \
            --max-unsafe-retry-rate 0.0
      - name: Build Docker image
        run: docker build -t ai-automation-doctor:ci .

  qwen3-real-benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install llama.cpp CPU binary
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b10336/llama-b10336-bin-ubuntu-x64.tar.gz \
            -o /tmp/llama.tar.gz
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server | head -1)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
      - name: Start Qwen3-1.7B Q4_K_M server
        run: |
          set -euxo pipefail
          "$LLAMA_SERVER" \
            -hf ggml-org/Qwen3-1.7B-GGUF:Q4_K_M \
            --alias Qwen/Qwen3-1.7B \
            --host 127.0.0.1 \
            --port 8000 \
            --ctx-size 4096 \
            --threads 4 \
            --reasoning off \
            --reasoning-format none \
            > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/llama-server.pid)" 2>/dev/null; then
              cat /tmp/llama-server.log
              exit 1
            fi
            sleep 5
          done
          cat /tmp/llama-server.log
          exit 1
      - name: Probe three raw model outputs
        run: |
          python -m scripts.probe_ai_output \
            --api-base-url http://127.0.0.1:8000/v1 \
            --model Qwen/Qwen3-1.7B \
            --limit 3 \
            --output evals/results/qwen_raw_probe.json
      - name: Print probe
        if: always()
        run: |
          cat evals/results/qwen_raw_probe.json 2>/dev/null || true
          tail -50 /tmp/llama-server.log 2>/dev/null || true
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-raw-probe
          path: evals/results/qwen_raw_probe.json
          if-no-files-found: warn
          retention-days: 1
